name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Unsigned release outputs; signing happens outside GitHub so the upload key never lives here.
      - run: flutter build appbundle --release --dart-define-from-file=config/release.json
      - run: flutter build apk --release --dart-define-from-file=config/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: hijab-style-release-unsigned
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
