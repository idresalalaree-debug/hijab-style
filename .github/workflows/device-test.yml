name: Device smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The runner image is nearly full; the emulator system image needs several GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      # Same release build that ships (R8, AOT, production ad unit ids), signed with a throwaway key.
      - run: flutter build apk --release --dart-define-from-file=config/release.json
      - name: Sign with throwaway key
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -keystore t.jks -storepass android -keypass android -alias t -keyalg RSA -validity 1 -dname CN=t
          "$BT/zipalign" -f -p 4 build/app/outputs/flutter-apk/app-release.apk aligned.apk
          "$BT/apksigner" sign --ks t.jks --ks-pass pass:android --out smoke.apk aligned.apk
          rm -rf build aligned.apk ~/.gradle/caches && df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: timeout 1500 bash tool/smoke.sh
      - name: Publish report to ci-reports branch
        if: always()
        run: |
          mkdir -p report && cp smoke.apk report/hijab-style-test.apk 2>/dev/null; cd report && echo "$GITHUB_SHA" > SOURCE_SHA
          git init -q -b ci-reports && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Smoke report for $GITHUB_SHA" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-reports
